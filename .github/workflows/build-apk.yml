name: Build APK

# Builds the app from the files in this repository and publishes the APK on
# the Releases page. Runs on every commit to main, and from the Actions tab.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "**/testclips.zip"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a Release

concurrency:
  group: build-apk
  cancel-in-progress: true # a newer commit replaces a build still running

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the files from this repository
        uses: actions/checkout@v7

      - name: Find the project
        run: |
          # The project can sit at the top of the repository or in its own
          # folder (e.g. Verba/); the workflows always live in .github/workflows.
          gradlew=$(find . -maxdepth 3 -path ./.git -prune -o -name gradlew -type f -print | head -n 1)
          if [ -z "$gradlew" ]; then
            echo "::error::No gradlew file found. Upload the contents of the Verba folder to the top of the repository."
            exit 1
          fi
          echo "APP_DIR=$(dirname "$gradlew")" >> "$GITHUB_ENV"
          echo "APP_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Point the app at this repository's speech models
        run: |
          # The Hinglish models are published on this repository's Releases page
          # by the "Speech models" workflow; the app downloads them from here.
          printf 'REPO = "%s"\n' "$GITHUB_REPOSITORY" > "$APP_DIR/app/src/main/python/verba/_repo.py"
          cat "$APP_DIR/app/src/main/python/verba/_repo.py"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The app's Python backend uses Python 3.13; the build machine needs the same version.
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test the Python backend
        run: |
          cd "$APP_DIR"
          if [ -f tools/test_backend.py ]; then
            python tools/test_backend.py
          else
            echo "::notice::tools/test_backend.py is not in the repository yet; skipping the backend tests."
          fi

      - name: Build the APK
        run: |
          cd "$APP_DIR"
          chmod +x gradlew   # uploads through the website lose the "executable" flag
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp "$APP_DIR/app/build/outputs/apk/release/app-release.apk" "$APP_NAME-${{ github.run_number }}.apk"

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: "*.apk"
          if-no-files-found: error

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download the .apk below on your phone and open it to install.
          files: "*.apk"
